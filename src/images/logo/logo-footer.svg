<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  width="460"
  height="120"
  viewBox="0 0 460 120"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="PowerForge Logo Black Text Only"
>
  <!-- Icon -->
  <g transform="translate(18,12) scale(0.82)">
    <!-- Shield / Anvil -->
    <path
      d="M50 0
         L100 20
         V70
         C100 100 50 120 50 120
         C50 120 0 100 0 70
         V20
         Z"
      fill="#1a1a1a"
      stroke="#b11226"
      stroke-width="4"
    />

    <!-- Lightning Bolt -->
    <path
      d="M55 18
         L35 60
         H52
         L45 102
         L75 55
         H55
         Z"
      fill="#e1062c"
    />

    <!-- Barbell -->
    <rect x="18" y="78" width="64" height="6" rx="3" fill="#b11226"/>
    <rect x="10" y="72" width="6" height="18" rx="2" fill="#b11226"/>
    <rect x="84" y="72" width="6" height="18" rx="2" fill="#b11226"/>
  </g>

  <!-- Text -->
  <g transform="translate(140,70)">
    <!-- POWERFORGE (black) -->
    <text
      x="0"
      y="0"
      fill="#000000"
      font-size="36"
      font-weight="800"
      letter-spacing="1.4"
      font-family="Montserrat, Poppins, Arial, sans-serif"
    >
      POWERFORGE
    </text>

    <!-- Tagline (unchanged red) -->
    <text
      x="2"
      y="26"
      fill="#b11226"
      font-size="13"
      letter-spacing="1.1"
      font-family="Montserrat, Arial, sans-serif"
    >
      FORGE YOUR STRENGTH
    </text>
  </g>
</svg>
